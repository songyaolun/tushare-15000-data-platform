name: 权益平台离线验收
trigger:
  change:
jobs:
  offline_quality:
    name: Python 静态检查与离线验收
    # 使用 Codebase 内部预装 uv 镜像，由验收脚本检查 Python 3.11+。
    image: hub.byted.org/base/code_ai_ci_python_uv:latest
    steps:
      - id: verify
        name: 执行仓库验收
        commands:
          - uv run --no-project bash scripts/ci.sh
