name: 权益平台离线验收
trigger:
  change:
jobs:
  offline_quality:
    name: Python 静态检查与离线验收
    # 镜像预装固定版本 uv，不通过 Python 或 pip 引导安装。
    image: ghcr.io/astral-sh/uv:0.12.21-python3.11-bookworm-slim
    steps:
      - id: verify
        name: 执行仓库验收
        commands:
          - uv run --no-project bash scripts/ci.sh
