[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tushare-entitlement-hub"
version = "0.1.0"
description = "可审计、离线优先的 Tushare Pro 权益平台"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<2", "httpx>=0.28,<1", "typer>=0.16,<1", "beautifulsoup4>=4.13,<5", "markdown>=3.8,<4"]

[project.scripts]
tushare-hub = "tushare_entitlement_hub.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "coverage>=7.10.6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-beautifulsoup4", "types-Markdown"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["tushare_entitlement_hub"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tushare_entitlement_hub"]
